<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>视频</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #000;
    }

    video {
      display: block;
      width: 100%;
      max-height: 100vh;
    }

    main {
      position: relative;
      width: 100%;
    }

    button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 0.75rem 1.25rem;
      border: 0;
      border-radius: 0.5rem;
      background: #fff;
      color: #111;
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <video autoplay playsinline controls>
      <source src="93dfbca10342396eebf3a3186751b1a5.mp4" type="video/mp4">
    </video>
    <button type="button" hidden>播放视频</button>
  </main>
  <script>
    const video = document.querySelector('video');
    const playButton = document.querySelector('button');

    video.addEventListener('playing', () => {
      playButton.hidden = true;
    });

    playButton.addEventListener('click', () => {
      video.muted = false;
      video.play().catch(() => {
        playButton.hidden = false;
      });
    });

    playButton.hidden = !video.paused;
  </script>
</body>
</html>
